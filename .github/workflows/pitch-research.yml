name: Frozen pitch CPU research (no DSP promotion)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['tools/pitch-research/request.json']
permissions:
  contents: read
concurrency:
  group: pitch-18e1c1d-research-01
  cancel-in-progress: false
jobs:
  research:
    if: github.ref == 'refs/heads/main' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate frozen request and tooling tests
        run: |
          python3 -m unittest discover -s tools/pitch-research -p 'test_*.py' -v
          python3 tools/pitch-research/run.py --repo "$GITHUB_WORKSPACE" --out "$RUNNER_TEMP/pitch-plan" --work "$RUNNER_TEMP/pitch-plan-work" --dry-run
      - name: Fresh paired correctness and calibrated native screen
        env:
          CXX: g++
          CC: gcc
        run: >-
          python3 tools/pitch-research/run.py
          --repo "$GITHUB_WORKSPACE"
          --out "$GITHUB_WORKSPACE/pitch-research-results"
          --work "$RUNNER_TEMP/pitch-research-work"
      - name: Preserve raw receipts even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pitch-research-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            pitch-research-results/
            ${{ runner.temp }}/pitch-plan/
          if-no-files-found: warn
          retention-days: 30
          compression-level: 1
