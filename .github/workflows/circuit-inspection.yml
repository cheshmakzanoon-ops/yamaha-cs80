name: Circuit source inspection

on:
  push:
    paths:
      - '.github/workflows/circuit-inspection.yml'
      - 'scripts/inspect_circuit_sources.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: circuit-inspection-${{ github.ref }}
  cancel-in-progress: true

jobs:
  inspect:
    name: Original service schematic / ${{ matrix.page }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # Completion evidence: all 25 unresolved matrix cells, their paired
        # board layouts, the M41 filter input and the ADJ printed-p11 setup.
        page: [t51, t52, t53, t54, t51w, t52w, t53w, t54w, m, cs80adjust_filter]
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install official Ubuntu PDF inspection tools
        if: matrix.page == 'icguide_152' || matrix.page == 'icguide_sub' || matrix.page == 'icguide' || matrix.page == 'icguide_index' || matrix.page == 'icguide_offset' || matrix.page == 'icguide_156' || matrix.page == 'icguide_kas' || matrix.page == 'icguide_vco' || matrix.page == 'cs20m_q' || matrix.page == 'cs80adjust' || matrix.page == 'cs80adjust_filter' || matrix.page == 'adjupdates_a' || matrix.page == 'adjupdates_b'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends poppler-utils
      - name: Install source inspection dependency
        run: python -m pip install 'Pillow==11.3.0'
      - name: Inspect original circuit source
        run: python scripts/inspect_circuit_sources.py --page "${{ matrix.page }}"
