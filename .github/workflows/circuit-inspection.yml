name: Circuit source inspection

on:
  push:
    paths:
      - '.github/workflows/circuit-inspection.yml'
      - 'scripts/inspect_circuit_sources.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: circuit-inspection-${{ github.ref }}
  cancel-in-progress: true

jobs:
  inspect:
    name: Original service schematic / ${{ matrix.page }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        page: [oe55, oe56, t51, t51w, t52, t52w, t53, t53w, t54, t54w]
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install official Ubuntu PDF inspection tools
        if: matrix.page == 'icguide_152' || matrix.page == 'icguide_sub' || matrix.page == 'icguide' || matrix.page == 'icguide_index' || matrix.page == 'icguide_offset' || matrix.page == 'icguide_156' || matrix.page == 'icguide_kas' || matrix.page == 'icguide_vco' || matrix.page == 'cs20m_q' || matrix.page == 'cs80adjust' || matrix.page == 'adjupdates_a' || matrix.page == 'adjupdates_b'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends poppler-utils
      - name: Install source inspection dependency
        run: python -m pip install 'Pillow==11.3.0'
      - name: Inspect original circuit source
        env:
          CS80_CROP_OUTPUT_DIR: ${{ runner.temp }}/cs80-crops
        run: python scripts/inspect_circuit_sources.py --page "${{ matrix.page }}"
      - name: Retain native inspection crops
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: service-manual-${{ matrix.page }}
          path: ${{ runner.temp }}/cs80-crops
          if-no-files-found: ignore
          retention-days: 7
