name: DSP numerical measurements

on:
  workflow_dispatch:
  push:
    paths:
      - 'src/core/**'
      - 'src/reference/**'
      - 'tests/**'
      - 'scripts/*pluginval*.sh'
      - 'src/tools/dsp_probe.cpp'
      - 'src/tools/parity_capture.cpp'
      - 'scripts/analyze_dsp.py'
      - 'scripts/parity_harness.py'
      - 'CMakeLists.txt'
      - '.github/workflows/dsp-measurements.yml'
permissions:
  contents: read
concurrency:
  group: dsp-measurements-${{ github.ref }}
  cancel-in-progress: true
jobs:
  measure:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned numerical plotting tools
        run: python -m pip install numpy==2.2.6 matplotlib==3.10.3
      - name: Build standalone numerical probe
        run: |
          cmake -S . -B build-probe -DCMAKE_BUILD_TYPE=Release -DCS80_BUILD_PLUGIN=OFF
          cmake --build build-probe --target cs80_dsp_probe cs80_parity_capture --parallel 2
      - name: Measure and enforce regression bounds
        run: |
          ./build-probe/cs80_dsp_probe artifacts/dsp-probe
          python scripts/analyze_dsp.py artifacts/dsp-probe
      - name: Export actual-engine candidate with exact-source provenance
        run: |
          python tests/test_parity_capture.py --capture ./build-probe/cs80_parity_capture
          ./build-probe/cs80_parity_capture --out artifacts/engine-candidate
          printf '{"commit":"%s","run":"%s","analog_evidence":false}\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" > artifacts/engine-candidate/provenance.json
          sha256sum src/core/Engine.cpp src/core/Engine.h src/core/Dsp.h src/core/Params.h src/core/PerformanceControls.h src/core/OriginalSubOscillator.h src/core/ExternalModulationInterpolator.h src/tools/parity_capture.cpp > artifacts/engine-candidate/SOURCE_SHA256SUMS
          sha256sum build-probe/cs80_parity_capture > artifacts/engine-candidate/BINARY_SHA256SUMS
          { c++ --version; cmake --version; uname -sm; grep -E '^CMAKE_(BUILD_TYPE|CXX_COMPILER|CXX_FLAGS)' build-probe/CMakeCache.txt; } > artifacts/engine-candidate/build-environment.txt
          (cd artifacts/engine-candidate && sha256sum *.csv *.json SOURCE_SHA256SUMS BINARY_SHA256SUMS build-environment.txt > SHA256SUMS)
      - uses: actions/upload-artifact@v5
        with:
          name: cs80-engine-candidate-${{ github.sha }}
          path: artifacts/engine-candidate
          if-no-files-found: error
      - name: Upload source-traceable graphs and raw traces
        uses: actions/upload-artifact@v5
        with:
          name: cs80-dsp-${{ github.sha }}
          path: artifacts/dsp-probe
          if-no-files-found: error

  parity-harness:
    name: Synthetic reference comparison (not hardware evidence)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test comparison failures and provenance gates
        run: python tests/test_parity_harness.py
      - name: Compare deterministic synthetic stand-in traces
        run: python scripts/parity_harness.py synthetic --out artifacts/parity-harness
      - uses: actions/upload-artifact@v5
        with:
          name: cs80-synthetic-comparison-${{ github.sha }}
          path: artifacts/parity-harness
          if-no-files-found: error

  sanitizers:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Configure ASan and UBSan core build
        run: >
          cmake -S . -B build-sanitizers -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DCS80_BUILD_PLUGIN=OFF
          -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
      - name: Build instrument and circuit tests
        run: cmake --build build-sanitizers --parallel 2
      - name: Run sanitizer and validator-fixture tests
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: ctest --test-dir build-sanitizers --output-on-failure
