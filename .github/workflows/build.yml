name: build

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux / VST3 + Standalone
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config \
            libasound2-dev libx11-dev libxext-dev libxrandr-dev libxcursor-dev \
            libxinerama-dev libxrender-dev libxcomposite-dev libgl1-mesa-dev \
            libfreetype-dev libfontconfig1-dev libcurl4-openssl-dev \
            libwebkit2gtk-4.1-dev fonts-dejavu-core xvfb

      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCS80_BUILD_PLUGIN=ON
          -DCS80_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build --parallel "$(nproc)"

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Upload Linux VST3
        uses: actions/upload-artifact@v5
        with:
          name: cs80-linux-vst3
          path: build/CS80Reference_artefacts/Release/VST3
          if-no-files-found: error

      - name: Render demo and screenshots
        run: |
          mkdir -p artifacts/ui
          ./build/cs80_render --out artifacts/cs80-demo.wav --seconds 12
          JUCE_FONT_PATH=/usr/share/fonts/truetype/dejavu \
            ./build/CS80Snapshots_artefacts/Release/CS80Snapshots \
            --out artifacts/ui --self-test

      - name: Upload render artifacts
        uses: actions/upload-artifact@v5
        with:
          name: cs80-linux-artifacts
          path: artifacts
          if-no-files-found: error

  pluginval:
    name: pluginval / Linux VST3 (strictness 10)
    needs: linux
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PLUGINVAL_VERSION: "1.0.4"
    steps:
      # The validation wrapper lives in the repository, so this job needs a
      # checkout even though the plugin itself arrives as an artifact.
      - uses: actions/checkout@v5

      - name: Download Linux VST3
        uses: actions/download-artifact@v5
        with:
          name: cs80-linux-vst3
          path: vst3

      - name: Install pluginval runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2t64 libfontconfig1 libfreetype6 \
            libx11-6 libxext6 libxrandr2 libxcursor1 libxinerama1 \
            libxrender1 libxcomposite1 libxkbcommon0 libxcb1 libgl1 \
            fonts-dejavu-core xauth xvfb unzip

      - name: Fetch pluginval ${{ env.PLUGINVAL_VERSION }}
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 --retry-delay 2 \
            -o pluginval.zip \
            "https://github.com/Tracktion/pluginval/releases/download/v${PLUGINVAL_VERSION}/pluginval_Linux.zip"
          unzip -q pluginval.zip -d pluginval
          test -x pluginval/pluginval
          ./pluginval/pluginval --version | tee pluginval-version.txt

      # scripts/run-pluginval-linux.sh asserts that pluginval really printed
      # SUCCESS and retries only the known pluginval 1.0.4 Linux run-loop
      # teardown crash (post-suite, no failed test), which is a race inside the
      # validator, not in this plugin. Any failed test fails immediately.
      - name: Validate VST3 headless
        run: |
          set -euo pipefail
          mkdir -p pluginval-reports
          ./scripts/run-pluginval-linux.sh pluginval-headless.log \
            ./pluginval/pluginval \
            --strictness-level 10 \
            --validate-in-process \
            --skip-gui-tests \
            --timeout-ms 120000 \
            --output-dir pluginval-reports \
            --output-filename cs80-headless \
            "$PWD/vst3/CS-80 Reference.vst3"

      - name: Validate VST3 GUI under Xvfb
        run: |
          set -euo pipefail
          xvfb-run -a -s "-screen 0 1920x1200x24" \
            ./scripts/run-pluginval-linux.sh pluginval-gui.log \
            ./pluginval/pluginval \
            --strictness-level 10 \
            --validate-in-process \
            --timeout-ms 120000 \
            --output-dir pluginval-reports \
            --output-filename cs80-gui \
            "$PWD/vst3/CS-80 Reference.vst3"

      - name: Report pluginval failure
        if: failure()
        run: |
          for log in pluginval-headless.log pluginval-gui.log; do
            if [ -f "$log" ]; then
              echo "::error title=pluginval $(basename "$log")::$(tail -n 20 "$log" | tr '\n' ' ')"
            fi
          done

      - name: Upload pluginval reports
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: cs80-pluginval-reports
          path: |
            pluginval-reports
            pluginval-headless.log
            pluginval-headless-attempt*.log
            pluginval-gui.log
            pluginval-gui-attempt*.log
            pluginval-version.txt
          if-no-files-found: warn

  macos:
    name: macOS / VST3 + AU + Standalone
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCS80_BUILD_PLUGIN=ON
          -DCS80_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Fetch pluginval 1.0.4
        env:
          PLUGINVAL_VERSION: "1.0.4"
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 --retry-delay 2 \
            -o pluginval.zip \
            "https://github.com/Tracktion/pluginval/releases/download/v${PLUGINVAL_VERSION}/pluginval_macOS.zip"
          unzip -q pluginval.zip -d pluginval
          xattr -dr com.apple.quarantine pluginval/pluginval.app || true
          ./pluginval/pluginval.app/Contents/MacOS/pluginval --version

      # Audio Unit hosts discover AUs through AudioComponentRegistrar, not
      # through the build tree. Register the exact built bundle in the
      # per-user Components directory, then force the registrar to rescan.
      - name: Register built AU
        run: |
          set -euo pipefail
          AU_SOURCE="$PWD/build/CS80Reference_artefacts/Release/AU/CS-80 Reference.component"
          AU_DEST="$HOME/Library/Audio/Plug-Ins/Components/CS-80 Reference.component"
          test -d "$AU_SOURCE"
          mkdir -p "$HOME/Library/Audio/Plug-Ins/Components"
          rm -rf "$AU_DEST"
          cp -R "$AU_SOURCE" "$AU_DEST"
          codesign --force --sign - "$AU_DEST"
          killall -9 AudioComponentRegistrar || true
          sleep 2
          ls -ld "$AU_DEST"

      - name: Validate VST3 with pluginval
        run: |
          set -euo pipefail
          mkdir -p pluginval-reports
          ./pluginval/pluginval.app/Contents/MacOS/pluginval \
            --strictness-level 10 \
            --validate-in-process \
            --skip-gui-tests \
            --timeout-ms 120000 \
            --output-dir pluginval-reports \
            --output-filename cs80-vst3 \
            "$PWD/build/CS80Reference_artefacts/Release/VST3/CS-80 Reference.vst3" \
            2>&1 | tee pluginval-vst3.log
          grep -qx 'SUCCESS' pluginval-vst3.log

      - name: Validate AU with pluginval
        run: |
          set -euo pipefail
          ./pluginval/pluginval.app/Contents/MacOS/pluginval \
            --strictness-level 10 \
            --validate-in-process \
            --skip-gui-tests \
            --timeout-ms 120000 \
            --output-dir pluginval-reports \
            --output-filename cs80-au \
            "$HOME/Library/Audio/Plug-Ins/Components/CS-80 Reference.component" \
            2>&1 | tee pluginval-au.log
          grep -qx 'SUCCESS' pluginval-au.log

      - name: Validate AU with pluginval GUI
        run: |
          set -euo pipefail
          ./pluginval/pluginval.app/Contents/MacOS/pluginval \
            --strictness-level 10 \
            --validate-in-process \
            --timeout-ms 120000 \
            --output-dir pluginval-reports \
            --output-filename cs80-au-gui \
            "$HOME/Library/Audio/Plug-Ins/Components/CS-80 Reference.component" \
            2>&1 | tee pluginval-au-gui.log
          grep -qx 'SUCCESS' pluginval-au-gui.log

      - name: AU registration diagnostics
        if: failure()
        run: |
          echo '--- installed component ---'
          ls -la "$HOME/Library/Audio/Plug-Ins/Components" || true
          codesign -dv "$HOME/Library/Audio/Plug-Ins/Components/CS-80 Reference.component" || true
          echo '--- registered audio units ---'
          auval -a 2>&1 | grep -i 'cs-80' || true

      - name: Report pluginval failure
        if: failure()
        run: |
          for log in pluginval-vst3.log pluginval-au.log pluginval-au-gui.log; do
            if [ -f "$log" ]; then
              echo "::error title=pluginval $(basename "$log")::$(tail -n 20 "$log" | tr '\n' ' ')"
            fi
          done

      - name: Upload pluginval reports
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: cs80-pluginval-macos
          path: |
            pluginval-reports
            pluginval-vst3.log
            pluginval-au.log
            pluginval-au-gui.log
          if-no-files-found: warn

  windows:
    name: Windows / VST3 + Standalone
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5

      - name: Configure
        id: configure
        shell: pwsh
        continue-on-error: true
        run: |
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64 `
            -DCS80_BUILD_PLUGIN=ON `
            -DCS80_BUILD_TESTS=ON 2>&1 | Tee-Object -FilePath configure.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Report CMake failure
        if: steps.configure.outcome == 'failure'
        shell: pwsh
        run: |
          $message = (Get-Content configure.log -Tail 25) -join ' || '
          Write-Output "::error title=Windows CMake::$message"
          exit 1

      - name: Build
        if: steps.configure.outcome == 'success'
        run: cmake --build build --config Release --parallel

      - name: Test
        if: steps.configure.outcome == 'success'
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Upload Windows VST3
        if: steps.configure.outcome == 'success'
        uses: actions/upload-artifact@v5
        with:
          name: cs80-windows-vst3
          path: build/CS80Reference_artefacts/Release/VST3
          if-no-files-found: error

  pluginval-windows:
    name: pluginval / Windows VST3 (strictness 10)
    needs: windows
    runs-on: windows-2022
    timeout-minutes: 20
    env:
      PLUGINVAL_VERSION: "1.0.4"
    steps:
      - name: Download Windows VST3
        uses: actions/download-artifact@v5
        with:
          name: cs80-windows-vst3
          path: vst3

      - name: Fetch pluginval ${{ env.PLUGINVAL_VERSION }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $url = "https://github.com/Tracktion/pluginval/releases/download/v$env:PLUGINVAL_VERSION/pluginval_Windows.zip"
          Invoke-WebRequest -Uri $url -OutFile pluginval.zip
          Expand-Archive -Path pluginval.zip -DestinationPath pluginval -Force
          Unblock-File -Path pluginval\pluginval.exe
          & .\pluginval\pluginval.exe --version | Tee-Object -FilePath pluginval-version.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Validate VST3 headless
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path pluginval-reports | Out-Null
          & .\pluginval\pluginval.exe `
            --strictness-level 10 `
            --validate-in-process `
            --skip-gui-tests `
            --timeout-ms 120000 `
            --output-dir pluginval-reports `
            --output-filename cs80-windows `
            "vst3\CS-80 Reference.vst3" 2>&1 | Tee-Object -FilePath pluginval-windows.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Select-String -Path pluginval-windows.log -Pattern '^SUCCESS$' -Quiet)) {
            Write-Output "::error title=pluginval Windows::validator exited without printing SUCCESS"
            exit 1
          }

      - name: Report pluginval failure
        if: failure()
        shell: pwsh
        run: |
          if (Test-Path pluginval-windows.log) {
            $message = (Get-Content pluginval-windows.log -Tail 20) -join ' || '
            Write-Output "::error title=pluginval Windows::$message"
          }

      - name: Upload pluginval reports
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: cs80-pluginval-windows
          path: |
            pluginval-reports
            pluginval-windows.log
            pluginval-version.txt
          if-no-files-found: warn
