name: Hardware panel screenshots

on:
  workflow_dispatch:
  push:
    branches-ignore:
      - ui-preview
    paths:
      - 'src/plugin/**'
      - 'src/core/**'
      - 'src/tools/ui_snapshot.cpp'
      - 'tests/*.h'
      - 'scripts/run-ui-smoke-linux.sh'
      - 'CMakeLists.txt'
      - '.github/workflows/screenshots.yml'

permissions:
  contents: write

concurrency:
  group: panel-screenshots-${{ github.ref }}
  cancel-in-progress: true

jobs:
  screenshots:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - name: Install official Ubuntu build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build g++ pkg-config libasound2-dev libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxinerama-dev libxrender-dev libxcomposite-dev libgl1-mesa-dev libfreetype-dev libfontconfig1-dev fonts-dejavu-core xvfb xauth openbox x11-utils
      - name: Configure exact source
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build screenshot renderer and core tests
        run: cmake --build build --target CS80Snapshots cs80_tests --parallel 2
      - name: Verify core
        run: ./build/cs80_tests
      - name: Capture actual editor at every supported size and page
        run: |
          mkdir -p artifacts/ui
          JUCE_FONT_PATH=/usr/share/fonts/truetype/dejavu bash scripts/run-ui-smoke-linux.sh ./build/CS80Snapshots_artefacts/Release/CS80Snapshots --out artifacts/ui --self-test
          printf '{"commit":"%s","run":"%s","renderer":"JUCE software, actual plugin editor"}\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" > artifacts/ui/provenance.json
          sha256sum artifacts/ui/*.png > artifacts/ui/SHA256SUMS
      - name: Publish screenshot evidence
        uses: actions/upload-artifact@v5
        with:
          name: cs80-panel-${{ github.sha }}
          path: artifacts/ui
          if-no-files-found: error
      - name: Publish preview PNGs to the ui-preview branch (non-main only)
        if: github.ref != 'refs/heads/main'
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/preview" && mkdir "$RUNNER_TEMP/preview"
          cp artifacts/ui/*.png artifacts/ui/provenance.json "$RUNNER_TEMP/preview/"
          cd "$RUNNER_TEMP/preview"
          git init -q -b ui-preview
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "preview screenshots for ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ui-preview
      - name: Refresh repository screenshots from this exact source
        if: github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          git fetch origin main
          if [ "$(git rev-parse origin/main)" != "$GITHUB_SHA" ]; then
            echo "Newer code is already on main; keeping this run's screenshots as artifacts only."
            exit 0
          fi
          cp artifacts/ui/*.png docs/screenshots/
          cp artifacts/ui/provenance.json docs/screenshots/provenance.json
          cp artifacts/ui/SHA256SUMS docs/screenshots/SHA256SUMS
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots
          if ! git diff --cached --quiet; then
            git commit -m "docs: refresh verified panel screenshots [skip ci]"
            git push origin HEAD:main
          fi
