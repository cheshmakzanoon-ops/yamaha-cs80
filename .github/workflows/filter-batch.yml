name: Filter batch qualification

on:
  push:
    paths:
      - 'src/core/**'
      - 'src/experimental/ContinuousVoiceCircuit.h'
      - 'tests/*Batch*'
      - 'tests/test_filter_batch_admission.py'
      - 'CMakeLists.txt'
      - '.github/workflows/filter-batch.yml'
  pull_request:
    paths:
      - 'src/core/**'
      - 'src/experimental/ContinuousVoiceCircuit.h'
      - 'tests/*Batch*'
      - 'tests/test_filter_batch_admission.py'
      - 'CMakeLists.txt'
      - '.github/workflows/filter-batch.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core:
    name: ${{ matrix.compiler }} / batch ${{ matrix.batch }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        compiler: [g++, clang++]
        batch: ['DEFAULT', 'ON', 'OFF']
    steps:
      - uses: actions/checkout@v5
      - name: Configure core only
        env:
          CXX: ${{ matrix.compiler }}
          BATCH_MODE: ${{ matrix.batch }}
        run: |
          test ! -e build-filter-batch/CMakeCache.txt
          extra=()
          if [ "$BATCH_MODE" != DEFAULT ]; then
            extra+=("-DCS80_ENABLE_AVX2_FILTER_BATCH=$BATCH_MODE")
          fi
          cmake -S . -B build-filter-batch \
            -DCS80_BUILD_PLUGIN=OFF -DCMAKE_BUILD_TYPE=Release "${extra[@]}"
          expected="$BATCH_MODE"
          if [ "$expected" = DEFAULT ]; then expected=ON; fi
          grep -Fx "CS80_ENABLE_AVX2_FILTER_BATCH:BOOL=$expected" build-filter-batch/CMakeCache.txt
      - name: Build focused qualification tests
        run: >-
          cmake --build build-filter-batch --parallel 2 --target
          cs80_ig00156_batch_tests cs80_filter_batch_engine_tests
          cs80_filter_batch_scheduling_tests
      - name: Exactness and scheduling gates
        run: >-
          ctest --test-dir build-filter-batch --output-on-failure
          -R '^cs80_(ig00156_batch_tests|filter_batch_engine_tests|filter_batch_scheduling_tests|filter_batch_admission_tests)$'
