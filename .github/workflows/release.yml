name: release packages

# Installers and a universal macOS binary. Signing and notarization run only
# when their secrets exist; without them every artifact is labelled UNSIGNED
# (macOS bundles are ad-hoc signed so they load locally). This workflow does
# not replace build.yml: validate a commit there before releasing it.
# All entrypoints now require the independently reviewed numerical acceptance
# as well as the existing exact-main build/DSP/screenshot checks. A tag is NOT
# itself release approval; the peeled commit must equal approved current main.
#
# Optional repository secrets:
#   MACOS_CERTIFICATE_P12_BASE64, MACOS_CERTIFICATE_PASSWORD   Developer ID certificates (.p12)
#   MACOS_DEVELOPER_ID_APPLICATION, MACOS_DEVELOPER_ID_INSTALLER  signing identity names
#   APPLE_ID, APPLE_TEAM_ID, APPLE_APP_PASSWORD                 notarytool credentials
#   WINDOWS_CERTIFICATE_PFX_BASE64, WINDOWS_CERTIFICATE_PASSWORD  Authenticode certificate
on:
  workflow_dispatch:
    inputs:
      request_commit_sha:
        description: Full reviewed JSON-only request branch commit SHA (required for manual release)
        type: string
        required: true
  push:
    tags: ['v*']

permissions:
  contents: read
  actions: read

concurrency:
  group: cs80-reviewed-release-packages
  cancel-in-progress: false

jobs:
  preflight:
    name: Require approved exact-main source and numerical evidence
    runs-on: ubuntu-24.04
    outputs:
      expected_main_sha: ${{ steps.guard.outputs.expected_main_sha }}
    steps:
      # Always run the guard from current main, including when the event came
      # from a tag. A stale tag cannot supply a different guard implementation.
      - uses: actions/checkout@v5
        with:
          ref: main
          persist-credentials: false

      - name: Prove dispatcher and manual/tag rejection controls
        run: >
          node --test
          tests/release/dispatch-reviewed-release.test.cjs
          tests/release/numerical-dispatch-addition.test.cjs
          tests/release/release-entrypoint-preflight.test.cjs
          tests/release/trusted-main-dispatch.test.cjs

      - name: Require reviewed main, numerical acceptance and correct event/tag
        id: guard
        uses: actions/github-script@v7
        env:
          REQUEST_COMMIT_SHA: ${{ inputs.request_commit_sha }}
        with:
          script: |
            const { execFileSync } = require('node:child_process');
            const preflight = require('./scripts/preflight-release-entrypoint.cjs');
            const checkoutSha = execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).trim();
            const result = await preflight({ github, context, core, checkoutSha,
              requestSha: process.env.REQUEST_COMMIT_SHA });
            core.setOutput('expected_main_sha', result.expected_main_sha);

  macos-universal:
    name: macOS universal / VST3 + AU + Standalone installer
    needs: preflight
    runs-on: macos-15
    env:
      HAVE_MAC_CERT: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 != '' }}
      HAVE_NOTARY: ${{ secrets.APPLE_APP_PASSWORD != '' }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.preflight.outputs.expected_main_sha }}
          persist-credentials: false

      - name: Require the preflight-approved source checkout
        run: test "$(git rev-parse HEAD)" = "${{ needs.preflight.outputs.expected_main_sha }}"

      - name: Configure universal (arm64 + x86_64)
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
          -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0
          -DCS80_BUILD_PLUGIN=ON
          -DCS80_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Require both architectures in every binary
        run: |
          base="build/CS80Reference_artefacts/Release"
          for binary in "$base/VST3/CS-80 Reference.vst3/Contents/MacOS/CS-80 Reference" \
                        "$base/AU/CS-80 Reference.component/Contents/MacOS/CS-80 Reference" \
                        "$base/Standalone/CS-80 Reference.app/Contents/MacOS/CS-80 Reference"; do
            archs="$(lipo -archs "$binary")"
            echo "$binary: $archs"
            [[ " $archs " == *" arm64 "* && " $archs " == *" x86_64 "* ]]
          done

      - name: Import Developer ID certificates
        if: env.HAVE_MAC_CERT == 'true'
        env:
          P12: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/release.keychain-db"
          password="$(uuidgen)"
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/productsign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain"
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/cert.p12"

      - name: Sign bundles (Developer ID with hardened runtime, else ad hoc)
        env:
          IDENTITY: ${{ secrets.MACOS_DEVELOPER_ID_APPLICATION }}
        run: |
          base="build/CS80Reference_artefacts/Release"
          if [ "$HAVE_MAC_CERT" = true ]; then
            sign=(--force --timestamp --options runtime --sign "$IDENTITY")
          else
            sign=(--force --sign -)
          fi
          codesign "${sign[@]}" "$base/VST3/CS-80 Reference.vst3"
          codesign "${sign[@]}" "$base/AU/CS-80 Reference.component"
          codesign "${sign[@]}" --entitlements installer/macos/Standalone.entitlements "$base/Standalone/CS-80 Reference.app"
          for bundle in "$base/VST3/CS-80 Reference.vst3" "$base/AU/CS-80 Reference.component" "$base/Standalone/CS-80 Reference.app"; do
            codesign --verify --strict --verbose=2 "$bundle"
          done

      - name: Build installer package
        env:
          INSTALLER_IDENTITY: ${{ secrets.MACOS_DEVELOPER_ID_INSTALLER }}
        run: |
          identity=""
          if [ "$HAVE_MAC_CERT" = true ]; then identity="$INSTALLER_IDENTITY"; fi
          installer/macos/make-pkg.sh build packages "$identity"

      - name: Notarize and staple
        if: env.HAVE_MAC_CERT == 'true' && env.HAVE_NOTARY == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          pkg="$(ls packages/*.pkg)"
          xcrun notarytool submit "$pkg" --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_PASSWORD" --wait
          xcrun stapler staple "$pkg"
          xcrun stapler validate "$pkg"
          spctl --assess --type install --verbose "$pkg"

      - name: Label unsigned output
        if: env.HAVE_MAC_CERT != 'true' || env.HAVE_NOTARY != 'true'
        run: |
          for pkg in packages/*.pkg; do mv "$pkg" "${pkg%.pkg}-UNSIGNED.pkg"; done
          echo "::warning title=macOS package::No Developer ID or notarization secrets; the package is unsigned and Gatekeeper will block it."

      - name: Recheck main lease before publishing macOS artifact
        uses: actions/github-script@v7
        with:
          script: |
            const expected = '${{ needs.preflight.outputs.expected_main_sha }}';
            const current = (await github.rest.git.getRef({ ...context.repo, ref: 'heads/main' })).data.object.sha;
            if (current !== expected) throw new Error('Main moved before macOS artifact publication');

      - uses: actions/upload-artifact@v5
        with:
          name: cs80-macos-universal-installer
          path: packages/
          if-no-files-found: error
          compression-level: 0

  windows-installer:
    name: Windows x64 / VST3 + Standalone installer
    needs: preflight
    runs-on: windows-2022
    env:
      HAVE_WIN_CERT: ${{ secrets.WINDOWS_CERTIFICATE_PFX_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.preflight.outputs.expected_main_sha }}
          persist-credentials: false

      - name: Require the preflight-approved source checkout
        shell: pwsh
        run: |
          $actual = git rev-parse HEAD
          if ($actual -ne '${{ needs.preflight.outputs.expected_main_sha }}') { throw 'Release source moved from preflight approval' }

      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -DCS80_BUILD_PLUGIN=ON -DCS80_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Import Authenticode certificate
        if: env.HAVE_WIN_CERT == 'true'
        shell: pwsh
        env:
          PFX: ${{ secrets.WINDOWS_CERTIFICATE_PFX_BASE64 }}
        run: |
          [IO.File]::WriteAllBytes("$env:RUNNER_TEMP\cert.pfx", [Convert]::FromBase64String($env:PFX))

      - name: Sign binaries
        if: env.HAVE_WIN_CERT == 'true'
        shell: pwsh
        env:
          PFX_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName | Select-Object -Last 1
          $base = "build\CS80Reference_artefacts\Release"
          foreach ($file in @("$base\VST3\CS-80 Reference.vst3\Contents\x86_64-win\CS-80 Reference.vst3", "$base\Standalone\CS-80 Reference.exe")) {
            & $signtool.FullName sign /f "$env:RUNNER_TEMP\cert.pfx" /p $env:PFX_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 "$file"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Build installer
        shell: pwsh
        run: |
          $version = (Select-String -Path CMakeLists.txt -Pattern 'project\(CS80Reference VERSION ([0-9.]+)').Matches[0].Groups[1].Value
          $build = (Resolve-Path "build\CS80Reference_artefacts\Release").Path
          New-Item -ItemType Directory -Force packages | Out-Null
          $out = (Resolve-Path packages).Path
          $license = (Resolve-Path "build\_deps\juce-src\LICENSE.md").Path
          & "C:\Program Files (x86)\Inno Setup 6\iscc.exe" "/DAppVersion=$version" "/DBuildDir=$build" "/DOutDir=$out" "/DJuceLicense=$license" installer\windows\cs80-reference.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Sign installer, or label it unsigned
        shell: pwsh
        env:
          PFX_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $setup = Get-ChildItem packages\*.exe | Select-Object -First 1
          if ($env:HAVE_WIN_CERT -eq 'true') {
            $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName | Select-Object -Last 1
            & $signtool.FullName sign /f "$env:RUNNER_TEMP\cert.pfx" /p $env:PFX_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 $setup.FullName
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } else {
            Rename-Item $setup.FullName ($setup.BaseName + "-UNSIGNED.exe")
            Write-Output "::warning title=Windows installer::No Authenticode secrets; the installer is unsigned."
          }

      - name: Recheck main lease before publishing Windows artifact
        uses: actions/github-script@v7
        with:
          script: |
            const expected = '${{ needs.preflight.outputs.expected_main_sha }}';
            const current = (await github.rest.git.getRef({ ...context.repo, ref: 'heads/main' })).data.object.sha;
            if (current !== expected) throw new Error('Main moved before Windows artifact publication');

      - uses: actions/upload-artifact@v5
        with:
          name: cs80-windows-installer
          path: packages/
          if-no-files-found: error
          compression-level: 0

  linux-packages:
    name: Linux x86_64 / .deb and tarball
    needs: preflight
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.preflight.outputs.expected_main_sha }}
          persist-credentials: false

      - name: Require the preflight-approved source checkout
        run: test "$(git rev-parse HEAD)" = "${{ needs.preflight.outputs.expected_main_sha }}"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config \
            libasound2-dev libx11-dev libxext-dev libxrandr-dev libxcursor-dev \
            libxinerama-dev libxrender-dev libxcomposite-dev libgl1-mesa-dev \
            libfreetype-dev libfontconfig1-dev libcurl4-openssl-dev \
            fonts-dejavu-core xvfb xauth openbox x11-utils

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCS80_BUILD_PLUGIN=ON -DCS80_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build --parallel "$(nproc)"

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Verify configured JUCE source
        run: >
          cmake -DBUILD_DIR=build
          -DEXPECTED_JUCE_SHA=c352e2489000ffeb9e397051377d75eef2efe641
          -DEXPECTED_JUCE_VERSION=8.0.11
          -P scripts/verify-ci-juce-source.cmake

      - name: Package
        run: |
          installer/linux/make-deb.sh build packages
          python scripts/package-ci-artifacts.py --platform linux --build-dir build --out-dir packages

      - name: Recheck main lease before publishing Linux artifact
        uses: actions/github-script@v7
        with:
          script: |
            const expected = '${{ needs.preflight.outputs.expected_main_sha }}';
            const current = (await github.rest.git.getRef({ ...context.repo, ref: 'heads/main' })).data.object.sha;
            if (current !== expected) throw new Error('Main moved before Linux artifact publication');

      - uses: actions/upload-artifact@v5
        with:
          name: cs80-linux-packages
          path: packages/
          if-no-files-found: error
          compression-level: 0
