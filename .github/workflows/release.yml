name: Publish Release

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Verified build.yml workflow run ID"
        required: true
        type: string
      tag:
        description: "Release tag (e.g. v2026.11.9)"
        required: true
        type: string
      target_sha:
        description: "Commit SHA to tag on main"
        required: true
        type: string
      title:
        description: "Release title"
        required: true
        type: string

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Download verified install bundles
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p bundles assets
          gh run download "${{ inputs.run_id }}" \
            -R "${{ github.repository }}" \
            -n cs80-windows-install-bundle \
            -n cs80-macos-15-install-bundle \
            -n cs80-macos-15-intel-install-bundle \
            -n cs80-linux-install-bundle \
            -D bundles

      - name: Verify bundle checksums and stage release assets
        run: |
          TAG="${{ inputs.tag }}"
          for dir in bundles/cs80-*-install-bundle; do
            (cd "$dir" && sha256sum -c SHA256SUMS)
          done
          cp bundles/cs80-windows-install-bundle/cs80-reference-windows-x86_64-*.zip \
            "assets/cs80-reference-windows-x86_64-${TAG}.zip"
          cp bundles/cs80-macos-15-install-bundle/cs80-reference-macos-arm64-*.tar.gz \
            "assets/cs80-reference-macos-arm64-${TAG}.tar.gz"
          cp bundles/cs80-macos-15-intel-install-bundle/cs80-reference-macos-x86_64-*.tar.gz \
            "assets/cs80-reference-macos-x86_64-${TAG}.tar.gz"
          cp bundles/cs80-linux-install-bundle/cs80-reference-linux-x86_64-*.tar.gz \
            "assets/cs80-reference-linux-x86_64-${TAG}.tar.gz"
          (cd assets && sha256sum cs80-reference-* > SHA256SUMS && cat SHA256SUMS)

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ inputs.tag }}"
          cat > release-notes.md <<EOF
          ## Highlights

          - **4-Slot Cinematic & Studio FX Rack**: Seven new built-in DSP effects (**Lush Hall Reverb**, **Shimmer Reverb**, **Tempo-Synced Stereo/Ping-Pong Delay**, **Dimension Stereo Chorus**, **Analog Flanger**, **Studio EQ & Bass-Safe Stereo Widener**, and **Bus Compressor / Glue**) plus global **FX Bypass**, **Master FX Wet**, and a quick **FX** toggle on the main toolbar.
          - **500 New Film Scoring Presets**: Individually voiced cinematic patches across 9 scoring roles (*Brass & Braams*, *Pads & Atmospheres*, *Strings & Choirs*, *Pulses & Ostinatos*, *Drones & Subscapes*, *Leads & Themes*, *Keys, Plucks & Bells*, *Impacts & Risers*, and *Sci-Fi & Noir*), browsable under the **FILM SCORING** category with role sub-tags (1,023 factory presets total).
          - **Realism & Baked-In FX Overhaul**: All 521 existing musical factory presets now feature organic voice dispersion, thermal drift, and tailored multi-slot studio FX (both Init patches remain completely dry).
          - **Verified Cross-Platform Builds**: Built and validated across Windows x64, macOS Apple Silicon (arm64), macOS Intel (x86-64), and Linux x86-64, passing all native test suites and \`pluginval\` strictness 10 (CI run [#${{ inputs.run_id }}](https://github.com/${{ github.repository }}/actions/runs/${{ inputs.run_id }})).
          EOF
          gh release create "$TAG" \
            "assets/cs80-reference-windows-x86_64-${TAG}.zip" \
            "assets/cs80-reference-macos-arm64-${TAG}.tar.gz" \
            "assets/cs80-reference-macos-x86_64-${TAG}.tar.gz" \
            "assets/cs80-reference-linux-x86_64-${TAG}.tar.gz" \
            "assets/SHA256SUMS" \
            -R "${{ github.repository }}" \
            --target "${{ inputs.target_sha }}" \
            --title "${{ inputs.title }}" \
            --notes-file release-notes.md
