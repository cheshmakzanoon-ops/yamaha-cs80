name: Frozen VST3 concurrency diagnostic
on:
  push:
    branches: [main]
    paths:
      - 'tools/vst3-concurrency-research/**'
      - '.github/workflows/vst3-concurrency-research.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: vst3-concurrency-f9dc1586-once
  cancel-in-progress: false
jobs:
  diagnostic:
    if: github.ref == 'refs/heads/main' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check frozen source and fail-closed tooling
        run: |
          git diff --exit-code f9dc1586bf8bfbecd51d776f97c6ed0100750d20 HEAD -- src tests CMakeLists.txt cmake
          python3 -m unittest discover -s tools/vst3-concurrency-research -p 'test_*.py' -v
      - name: Install unchanged build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config \
            libasound2-dev libx11-dev libxext-dev libxrandr-dev libxcursor-dev \
            libxinerama-dev libxrender-dev libxcomposite-dev libgl1-mesa-dev \
            libfreetype-dev libfontconfig1-dev libcurl4-openssl-dev \
            libwebkit2gtk-4.1-dev fonts-dejavu-core xvfb xauth openbox x11-utils
      - name: Configure original full test inventory
        run: >-
          cmake -S . -B build-diagnostic -G Ninja
          -DCMAKE_BUILD_TYPE=Release -DCS80_BUILD_PLUGIN=ON -DCS80_BUILD_TESTS=ON
      - name: Verify pinned JUCE source
        run: >-
          cmake -DBUILD_DIR=build-diagnostic
          -DEXPECTED_JUCE_SHA=c352e2489000ffeb9e397051377d75eef2efe641
          -DEXPECTED_JUCE_VERSION=8.0.11 -P scripts/verify-ci-juce-source.cmake
      - name: Build unchanged module and two diagnostic fixtures
        run: >-
          cmake --build build-diagnostic --parallel 2 --target
          cs80_vst3_automation_tests cs80_vst3_pwm_automation_tests
      - name: Fixed serial then two-way qualification
        run: >-
          python3 tools/vst3-concurrency-research/run.py
          --repo "$GITHUB_WORKSPACE" --build "$GITHUB_WORKSPACE/build-diagnostic"
          --out "$GITHUB_WORKSPACE/vst3-concurrency-results"
      - name: Preserve receipts even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: vst3-concurrency-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            vst3-concurrency-results/
            build-diagnostic/ci-juce-provenance.txt
          if-no-files-found: warn
          retention-days: 30
          compression-level: 6
